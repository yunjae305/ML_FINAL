name: 기계학습 기말과제

run-name: 기계학습 기말과제

on:
  push:
  pull_request:

jobs:
  test:
    name: 기계학습 기말과제
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Train model artifact
        run: python src/train.py
      - name: Run monitoring drift check
        run: python src/monitor.py
      - name: Run unit tests
        run: python -m unittest
      - name: Build Docker image
        run: docker build -t cardiocare:1.0 .
      - name: Run Docker inference
        run: docker run --rm cardiocare:1.0
